name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      dyndns_released: ${{ steps.release.outputs['apps/dyndns--release_created'] }}
      dyndns_tag: ${{ steps.release.outputs['apps/dyndns--tag_name'] }}
      c415_released: ${{ steps.release.outputs['apps/api--release_created'] }}
      c415_tag: ${{ steps.release.outputs['apps/api--tag_name'] }}
      example_released: ${{ steps.release.outputs['apps/example--release_created'] }}
      example_tag: ${{ steps.release.outputs['apps/example--tag_name'] }}
      c415_version: ${{ steps.release.outputs['apps/api--version'] }}
      website_version: ${{ steps.release.outputs['apps/website--version'] }}
      website_released: ${{ steps.release.outputs['apps/website--release_created'] }}
      website_tag: ${{ steps.release.outputs['apps/website--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload-dynDNS:
    needs: release-please
    if: ${{ needs.release-please.outputs.dyndns_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.dyndns_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          TAG="${{ needs.release-please.outputs.dyndns_tag }}"
          VERSION="${TAG#dynDNS-v}"
          COMMIT="$(git rev-parse --short HEAD)"
          make dyndns VERSION="$VERSION" COMMIT="$COMMIT" AUTHOR="ofgrenudo/415"
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.dyndns_tag }}" "bin/dyndns" --clobber

  build-and-upload-415:
    needs: release-please
    if: ${{ needs.release-please.outputs.c415_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.c415_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          TAG="${{ needs.release-please.outputs.c415_tag }}"
          VERSION="${TAG#415-v}"
          COMMIT="$(git rev-parse --short HEAD)"
          make api VERSION="$VERSION" COMMIT="$COMMIT" AUTHOR="ofgrenudo/415"
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.c415_tag }}" "bin/api" --clobber

  build-and-upload-example:
    needs: release-please
    if: ${{ needs.release-please.outputs.example_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.example_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          TAG="${{ needs.release-please.outputs.example_tag }}"
          VERSION="${TAG#example-v}"
          COMMIT="$(git rev-parse --short HEAD)"
          make example VERSION="$VERSION" COMMIT="$COMMIT" AUTHOR="ofgrenudo/415"
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.example_tag }}" "bin/example" --clobber

  publish-image-api:
    needs: release-please
    if: ${{ needs.release-please.outputs.c415_released == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: 415-api
      ref: ${{ needs.release-please.outputs.c415_tag }}
      version: ${{ needs.release-please.outputs.c415_version }}
      dockerfile: apps/api/Dockerfile

  publish-image-website:
    needs: release-please
    if: ${{ needs.release-please.outputs.website_released == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: 415-website
      ref: ${{ needs.release-please.outputs.website_tag }}
      version: ${{ needs.release-please.outputs.website_version }}
      context: apps/website
      dockerfile: apps/website/Dockerfile
