name: docker-publish

# Reusable: builds a multi-arch image and pushes it to GHCR.
on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/ (e.g. 415-api)
        type: string
        required: true
      ref:
        description: Git ref (release tag) to build
        type: string
        required: true
      version:
        description: Semver without prefix (e.g. 0.2.0)
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        description: Dockerfile path, relative to the repo root
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}"
          V="${{ inputs.version }}"
          MINOR="${V%.*}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$V"
            echo "$IMAGE:$MINOR"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            AUTHOR=ofgrenudo/415
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
