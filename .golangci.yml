version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - revive
  settings:
    revive:
      rules:
        # This codebase intentionally omits doc comments unless a WHY
        # needs explaining; don't require boilerplate WHAT comments.
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
