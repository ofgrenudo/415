<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- {{ partial "head.html" . }} optional if you want site CSS/JS -->
  <style>
    body {
        margin: 0px;
        padding: 0px;
    }
    ul {
  list-style: none; /* removes the bullet */
  padding-left: 0;  /* removes default indentation */
}

ul li {
  display: flex;
  align-items: center; /* vertically centers checkbox and text */
  gap: 0.5rem; /* optional spacing between checkbox and text */
}

  </style>
</head>
<body>
  <main>
    {{ .Content }}
  </main>
</body>
</html>
